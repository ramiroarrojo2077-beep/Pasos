name: Publicar pagina de descarga

# Deja el APK como archivo plano en una rama aparte, servido por
# raw.githubusercontent.com: una sola dirección, sin redirecciones a otro
# dominio ni URLs firmadas, que es lo que traba a los navegadores
# embebidos. Toma el archivo de la release, no recompila.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: descargas
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar la descarga directa
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Traer los archivos de la release
        run: |
          set -euo pipefail
          mkdir -p sitio
          gh release download ultima --repo "$REPO" --pattern 'Pasos.apk' --dir sitio
          gh release download ultima --repo "$REPO" --pattern 'Pasos.ipa' --dir sitio
          ls -lh sitio

      # Un APK es un zip: si abre sin errores, el archivo está entero.
      - name: Verificar que el APK esté sano
        run: |
          set -euo pipefail
          unzip -t sitio/Pasos.apk > /dev/null && echo "El zip del APK abre sin errores"
          echo "AndroidManifest presente:"
          unzip -l sitio/Pasos.apk | grep -c AndroidManifest.xml
          echo "Arquitecturas incluidas:"
          unzip -l sitio/Pasos.apk | grep -o 'lib/[^/]*' | sort -u
          echo "sha256:"
          sha256sum sitio/Pasos.apk

      - name: Armar la página
        run: |
          cat > sitio/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Pasos — Descargar</title>
            <style>
              :root { color-scheme: dark; }
              body {
                margin: 0; min-height: 100vh; display: grid; place-items: center;
                background: #0A0E1C; color: #EAF2FF; text-align: center;
                font-family: system-ui, -apple-system, sans-serif; padding: 24px;
              }
              .caja { max-width: 420px; }
              h1 { font-size: 34px; letter-spacing: 2px; margin: 0 0 6px; color: #B8FF3C; }
              p { color: #9DB2DC; line-height: 1.5; }
              a.boton {
                display: block; margin: 28px 0 10px; padding: 20px;
                background: #B8FF3C; color: #05070F; text-decoration: none;
                font-size: 19px; font-weight: 800; border: 3px solid #6E9E1F;
                box-shadow: 5px 5px 0 #03050C;
              }
              a.chico { color: #3CE7FF; font-size: 14px; }
              .nota { font-size: 13px; color: #5D7099; margin-top: 26px; }
            </style>
          </head>
          <body>
            <div class="caja">
              <h1>PASOS</h1>
              <p>Contador de pasos con torneos entre amigos y mapa de cafeterías.</p>
              <a class="boton" href="Pasos.apk" download>Descargar para Android</a>
              <p class="nota">
                35 MB · Android 8 o superior.<br>
                Al abrirlo, Android pide habilitar "Instalar apps desconocidas".
              </p>
              <p><a class="chico" href="Pasos.ipa" download>Descargar el .ipa para iPhone</a></p>
              <p class="nota">
                El .ipa va sin firmar: se instala con Sideloadly o AltStore
                desde una computadora, con tu Apple ID común.
              </p>
            </div>
          </body>
          </html>
          HTML
          ls -lh sitio

      # Rama huérfana con un solo commit: los binarios no engordan el
      # historial del proyecto, y cada publicación la reemplaza entera.
      - name: Publicar en la rama descargas
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp sitio/Pasos.apk sitio/Pasos.ipa sitio/index.html /tmp/pub/
          cd /tmp/pub
          git init -q -b descargas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Descarga directa de Pasos"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" descargas
          echo "Publicado en la rama descargas"

      - name: Direcciones finales
        run: |
          RAMA="https://raw.githubusercontent.com/$REPO/descargas"
          echo "APK: $RAMA/Pasos.apk"
          echo "IPA: $RAMA/Pasos.ipa"
