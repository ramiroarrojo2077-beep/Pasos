name: Compilar apps

# Compila el APK de Android y un .ipa de iPhone sin firmar.
# Se dispara a mano desde la pestaña Actions, o solo al publicar un tag v*.
on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: Qué compilar
        type: choice
        default: ambas
        options: [ambas, android, ios]
  push:
    tags: ['v*']

jobs:
  android:
    name: APK de Android
    if: github.event_name == 'push' || inputs.plataforma == 'ambas' || inputs.plataforma == 'android'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el proyecto nativo
        run: npx expo prebuild --platform android --no-install

      - name: Instalar el NDK que pide React Native
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"

      # Si cargaste el secret ANDROID_KEYSTORE_BASE64 se firma con tu clave;
      # si no, queda firmado con la clave de depuración, que igual se instala.
      - name: Usar tu keystore si existe
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar el APK
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk \
             "salida/Pasos-$(node -p "require('./app.json').expo.version").apk"
          ls -lh salida

      - uses: actions/upload-artifact@v4
        with:
          name: pasos-android-apk
          path: salida/*.apk
          if-no-files-found: error

  ios:
    name: iPhone (.ipa sin firmar)
    if: github.event_name == 'push' || inputs.plataforma == 'ambas' || inputs.plataforma == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el proyecto nativo
        run: npx expo prebuild --platform ios --no-install

      - name: Instalar los pods
        working-directory: ios
        run: pod install

      # Sin certificados de Apple no se puede firmar en CI, así que archivamos
      # sin firma. El .ipa resultante se instala con Sideloadly o AltStore.
      - name: Archivar sin firma
        run: |
          xcodebuild archive \
            -workspace ios/Pasos.xcworkspace \
            -scheme Pasos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pasos.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -quiet

      - name: Empaquetar el .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload" salida
          cp -R "$RUNNER_TEMP/Pasos.xcarchive/Products/Applications/Pasos.app" "$RUNNER_TEMP/Payload/"
          VERSION=$(node -p "require('./app.json').expo.version")
          (cd "$RUNNER_TEMP" && zip -qry "Pasos-$VERSION-sin-firmar.ipa" Payload)
          cp "$RUNNER_TEMP/Pasos-$VERSION-sin-firmar.ipa" salida/
          ls -lh salida

      - uses: actions/upload-artifact@v4
        with:
          name: pasos-ios-ipa
          path: salida/*.ipa
          if-no-files-found: error

  publicar:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: descargas
      - uses: softprops/action-gh-release@v2
        with:
          files: descargas/**/*
          generate_release_notes: true
