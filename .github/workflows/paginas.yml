name: Publicar pagina de descarga

# Sirve el APK como archivo plano en GitHub Pages: una sola URL, sin
# redirecciones ni URLs firmadas, que es lo que suele trabar a los
# navegadores embebidos. Toma el archivo de la release, no recompila.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar en Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Traer los archivos de la release
        run: |
          set -euo pipefail
          mkdir -p sitio
          gh release download ultima --repo "$REPO" --pattern 'Pasos.apk' --dir sitio
          gh release download ultima --repo "$REPO" --pattern 'Pasos.ipa' --dir sitio
          ls -lh sitio

      # Un APK es un zip: si abre sin errores, el archivo está entero.
      - name: Verificar que el APK esté sano
        run: |
          set -euo pipefail
          unzip -t sitio/Pasos.apk > /dev/null && echo "El zip del APK abre sin errores"
          echo "Contiene AndroidManifest:"
          unzip -l sitio/Pasos.apk | grep -c AndroidManifest.xml
          echo "Arquitecturas incluidas:"
          unzip -l sitio/Pasos.apk | grep -o 'lib/[^/]*' | sort -u
          echo "sha256:"
          sha256sum sitio/Pasos.apk

      - name: Armar la página
        run: |
          cat > sitio/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Pasos — Descargar</title>
            <style>
              :root { color-scheme: dark; }
              body {
                margin: 0; min-height: 100vh; display: grid; place-items: center;
                background: #0A0E1C; color: #EAF2FF; text-align: center;
                font-family: system-ui, -apple-system, sans-serif; padding: 24px;
              }
              .caja { max-width: 420px; }
              h1 { font-size: 34px; letter-spacing: 2px; margin: 0 0 6px; color: #B8FF3C; }
              p { color: #9DB2DC; line-height: 1.5; }
              a.boton {
                display: block; margin: 28px 0 10px; padding: 20px;
                background: #B8FF3C; color: #05070F; text-decoration: none;
                font-size: 19px; font-weight: 800; border: 3px solid #6E9E1F;
                box-shadow: 5px 5px 0 #03050C;
              }
              a.chico { color: #3CE7FF; font-size: 14px; }
              .nota { font-size: 13px; color: #5D7099; margin-top: 26px; }
            </style>
          </head>
          <body>
            <div class="caja">
              <h1>PASOS</h1>
              <p>Contador de pasos con torneos entre amigos y mapa de cafeterías.</p>
              <a class="boton" href="Pasos.apk" download>Descargar para Android</a>
              <p class="nota">
                35 MB · Android 8 o superior.<br>
                Al abrirlo, Android pide habilitar "Instalar apps desconocidas".
              </p>
              <p><a class="chico" href="Pasos.ipa" download>Descargar el .ipa para iPhone</a></p>
              <p class="nota">
                El .ipa va sin firmar: se instala con Sideloadly o AltStore
                desde una computadora, con tu Apple ID común.
              </p>
            </div>
          </body>
          </html>
          HTML
          ls -lh sitio

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Mostrar la dirección
        run: echo "Página publicada en ${{ steps.deploy.outputs.page_url }}"
