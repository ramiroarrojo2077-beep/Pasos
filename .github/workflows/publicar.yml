name: Publicar descarga

# Toma los archivos ya compilados por una corrida de "Compilar apps" y los
# publica en la release fija. Sirve para republicar sin volver a compilar.
on:
  workflow_dispatch:
    inputs:
      corrida:
        description: ID de la corrida de "Compilar apps" que tiene los archivos
        required: true

jobs:
  publicar:
    name: Publicar desde una corrida
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Bajar los archivos de esa corrida
        run: |
          set -euo pipefail
          gh run download "${{ inputs.corrida }}" --repo "$REPO" --dir descargas
          mkdir -p release
          find descargas -name '*.apk' -exec cp {} release/Pasos.apk \;
          find descargas -name '*.ipa' -exec cp {} release/Pasos.ipa \;
          ls -lh release

      - name: Actualizar la descarga directa
        run: |
          set -euo pipefail
          mkdir -p release
          find descargas -name 'Pasos*.apk' -exec cp {} release/Pasos.apk \; || true
          find descargas -name 'Pasos*.ipa' -exec cp {} release/Pasos.ipa \; || true
          ls -lh release
          unzip -t release/Pasos.apk > /dev/null && echo "El APK abre sin errores"

          rm -rf /tmp/pub
          if git clone -q --depth 1 --branch descargas \
               "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" /tmp/pub 2>/dev/null; then
            rm -rf /tmp/pub/.git
          else
            mkdir -p /tmp/pub
          fi

          cp release/* /tmp/pub/
          cd /tmp/pub
          git init -q -b descargas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Descarga directa de Pasos"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" descargas
          echo "APK: https://raw.githubusercontent.com/$REPO/descargas/Pasos.apk"

      - name: Crear o actualizar la release
        run: |
          set -uo pipefail
          for archivo in release/*; do
            nombre=$(basename "$archivo")
            for intento in 1 2 3; do
              gh release delete-asset ultima "$nombre" --repo "$REPO" --yes 2>/dev/null || true
              if gh release upload ultima "$archivo" --repo "$REPO" --clobber; then
                echo "$nombre subido"
                break
              fi
              echo "Intento $intento falló para $nombre, reintento"
              sleep $((intento * 10))
            done
          done

      - name: Confirmar que quedó publicada
        run: |
          gh release view ultima --repo "$REPO" --json tagName,assets \
            --jq '.tagName + " → " + ([.assets[].name] | join(", "))'
