name: Compilar apps

# Compila el APK de Android y un .ipa de iPhone sin firmar.
# Se dispara a mano desde la pestaña Actions, o solo al publicar un tag v*.
on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: Qué compilar
        type: choice
        default: ambas
        options: [ambas, android, ios]
  push:
    tags: ['v*']

jobs:
  android:
    name: APK de Android
    if: github.event_name == 'push' || inputs.plataforma == 'ambas' || inputs.plataforma == 'android'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el proyecto nativo
        run: npx expo prebuild --platform android --no-install

      - name: Instalar el NDK que pide React Native
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"

      # Si cargaste el secret ANDROID_KEYSTORE_BASE64 se firma con tu clave;
      # si no, queda firmado con la clave de depuración, que igual se instala.
      - name: Usar tu keystore si existe
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar el APK
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk \
             "salida/Pasos-$(node -p "require('./app.json').expo.version").apk"
          ls -lh salida

      - uses: actions/upload-artifact@v4
        with:
          name: pasos-android-apk
          path: salida/*.apk
          if-no-files-found: error

  ios:
    name: iPhone (.ipa sin firmar)
    if: github.event_name == 'push' || inputs.plataforma == 'ambas' || inputs.plataforma == 'ios'
    # Expo 57 trae dependencias Swift Package Manager que piden Swift 6.2,
    # y macos-15 solo llega a 6.1. macos-26 viene con Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Versiones de las herramientas
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el proyecto nativo
        run: npx expo prebuild --platform ios --no-install

      - name: Instalar los pods
        working-directory: ios
        run: pod install

      # Sin certificados de Apple no se puede firmar en CI, así que archivamos
      # sin firma. El log completo es enorme, así que lo guardamos y, si falla,
      # imprimimos solo las líneas de error.
      - name: Archivar sin firma
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Pasos.xcworkspace \
            -scheme Pasos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pasos.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -quiet 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Mostrar los errores del archivado
        if: failure()
        run: |
          echo "::group::Errores"
          grep -nE "error:|FAILED|Could not resolve" "$RUNNER_TEMP/xcodebuild.log" | head -40 || true
          echo "::endgroup::"

      - name: Empaquetar el .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload" salida
          cp -R "$RUNNER_TEMP/Pasos.xcarchive/Products/Applications/Pasos.app" "$RUNNER_TEMP/Payload/"
          VERSION=$(node -p "require('./app.json').expo.version")
          (cd "$RUNNER_TEMP" && zip -qry "Pasos-$VERSION-sin-firmar.ipa" Payload)
          cp "$RUNNER_TEMP/Pasos-$VERSION-sin-firmar.ipa" salida/
          ls -lh salida

      - uses: actions/upload-artifact@v4
        with:
          name: pasos-ios-ipa
          path: salida/*.ipa
          if-no-files-found: error

  # Publica los archivos en una release fija para que se puedan bajar con un
  # link directo, sin entrar a Actions, sin cuenta de GitHub y sin .zip de por
  # medio. El link nunca cambia: /releases/latest/download/Pasos.apk
  publicar:
    name: Publicar para descargar
    needs: [android, ios]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: descargas

      - name: Dejar los archivos con nombre fijo
        run: |
          mkdir -p release
          find descargas -name '*.apk' -exec cp {} release/Pasos.apk \; || true
          find descargas -name '*.ipa' -exec cp {} release/Pasos.ipa \; || true
          ls -lh release

      - name: Crear o actualizar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTAS="Descarga directa, sin cuenta de GitHub.

          **Android** — abrí este link desde el teléfono y tocá el archivo:
          https://github.com/$REPO/releases/latest/download/Pasos.apk

          La primera vez Android pide habilitar \"Instalar apps desconocidas\"
          para el navegador. Requiere Android 8 o superior.

          **iPhone** — el .ipa va sin firmar; se instala con Sideloadly o
          AltStore usando tu Apple ID común:
          https://github.com/$REPO/releases/latest/download/Pasos.ipa"

          if gh release view ultima --repo "$REPO" >/dev/null 2>&1; then
            gh release upload ultima release/* --repo "$REPO" --clobber
            gh release edit ultima --repo "$REPO" --notes "$NOTAS" --latest
          else
            gh release create ultima release/* --repo "$REPO" \
              --title "Última versión" --notes "$NOTAS" --latest
          fi

      - name: Confirmar que quedó publicada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release view ultima --repo "$REPO" --json tagName,assets \
            --jq '.tagName + " → " + ([.assets[].name] | join(", "))'
